<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeTrack | Acceso</title>
    <!-- Favicon de Reloj -->
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2088/2088617.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f0f4f8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background-color 0.2s, color 0.2s; }
        .bento-box { background: white; border-radius: 16px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); border: 1px solid #e2e8f0; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative px-4">

    <div class="fixed top-4 right-4">
        <button type="button" id="btn-tema-z8" onclick="ciclarTemaZ8()" class="px-3 py-1.5 rounded-lg bg-white border border-slate-200 text-xs font-bold text-slate-600 shadow-sm hover:bg-slate-100 transition">
            🌓 Auto
        </button>
    </div>

    <div class="bento-box w-full max-w-md p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 tracking-tight">TimeTrack<span class="text-blue-600">.</span></h1>
            <p class="text-gray-500 mt-2">Portal Operativo y Supervisión</p>
        </div>

        <form id="loginForm" class="space-y-6" onsubmit="iniciarSesion(event)">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2 uppercase text-xs">Usuario</label>
                <input type="text" id="usuario" class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:ring-2 focus:ring-blue-600 focus:border-transparent outline-none transition" required>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2 uppercase text-xs">Contraseña</label>
                <input type="password" id="password" class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:ring-2 focus:ring-blue-600 focus:border-transparent outline-none transition" required>
            </div>
            
            <button type="submit" id="btnSumbit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition shadow-md flex justify-center items-center">
                Acceder al Sistema
            </button>
            <p id="errorMsg" class="text-red-500 text-sm text-center font-medium hidden mt-2"></p>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>if (typeof window.supabase === 'undefined') { document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>'); }</script>
    <script src="api.js"></script>
    <script>
        async function loginDirectoRestFallback(usr, pass) {
            const url = `https://owjddgjnqhwvyoafhakm.supabase.co/rest/v1/usuarios?select=rol&nombre=eq.${encodeURIComponent(usr)}&clave=eq.${encodeURIComponent(pass.trim())}&limit=1`;
            const key = "sb_publishable_1o-mFgTMNbTvQiXuQ8JIJg_9O7u8inj";
            const resp = await fetch(url, {
                headers: { 'apikey': key, 'Authorization': `Bearer ${key}` }
            });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const rows = await resp.json();
            if (!rows || rows.length === 0) return { valido: false };
            return { valido: true, rol: rows[0].rol };
        }

        async function iniciarSesion(e) {
            e.preventDefault();
            const usr = document.getElementById('usuario').value.trim().toUpperCase();
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('btnSumbit');
            const errorMsg = document.getElementById('errorMsg');

            btn.innerHTML = '<span class="animate-pulse">Verificando credenciales...</span>';
            btn.disabled = true;
            errorMsg.classList.add('hidden');

            try {
                let data;
                if (typeof fetchGoogleAPI === 'function') {
                    try {
                        data = await fetchGoogleAPI("login", { usuario: usr, password: pass });
                    } catch (e1) {
                        data = await loginDirectoRestFallback(usr, pass);
                    }
                } else {
                    data = await loginDirectoRestFallback(usr, pass);
                }
                
                if (data && data.valido) {
                    localStorage.setItem('tt_usuario', usr);
                    localStorage.setItem('tt_rol', data.rol);
                    
                    if (data.rol === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'agente.html';
                    }
                } else {
                    errorMsg.textContent = "Credenciales incorrectas.";
                    errorMsg.classList.remove('hidden');
                    btn.innerHTML = 'Acceder al Sistema';
                    btn.disabled = false;
                }
            } catch (err) {
                errorMsg.textContent = "Error de conexión con el servidor (" + (err.message || "Red") + ").";
                errorMsg.classList.remove('hidden');
                btn.innerHTML = 'Acceder al Sistema';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
