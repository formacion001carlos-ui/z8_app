<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeTrack | Acceso</title>
    <!-- Favicon de Reloj -->
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2088/2088617.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f0f4f8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .bento-box { background: white; border-radius: 16px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">

    <div class="bento-box w-full max-w-md p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 tracking-tight">TimeTrack<span class="text-blue-600">.</span></h1>
            <p class="text-gray-500 mt-2">Portal Operativo y Supervisión</p>
        </div>

        <form id="loginForm" class="space-y-6" onsubmit="iniciarSesion(event)">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2 uppercase text-xs">Usuario</label>
                <input type="text" id="usuario" class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:ring-2 focus:ring-blue-600 focus:border-transparent outline-none transition" required>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2 uppercase text-xs">Contraseña</label>
                <input type="password" id="password" class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:ring-2 focus:ring-blue-600 focus:border-transparent outline-none transition" required>
            </div>
            
            <button type="submit" id="btnSumbit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition shadow-md flex justify-center items-center">
                Acceder al Sistema
            </button>
            <p id="errorMsg" class="text-red-500 text-sm text-center font-medium hidden mt-2"></p>
        </form>
    </div>

    <script src="api.js"></script>
    <script>
        async function iniciarSesion(e) {
            e.preventDefault();
            const usr = document.getElementById('usuario').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('btnSumbit');
            const errorMsg = document.getElementById('errorMsg');

            btn.innerHTML = '<span class="animate-pulse">Verificando credenciales...</span>';
            btn.disabled = true;
            errorMsg.classList.add('hidden');

            try {
                // Llamada a la API de Google
                const data = await fetchGoogleAPI("login", { usuario: usr, password: pass });
                
                if (data.valido) {
                    // Guardar sesión en el navegador
                    localStorage.setItem('tt_usuario', usr);
                    localStorage.setItem('tt_rol', data.rol);
                    
                    // Routing: Redirigir a la vista correcta
                    if (data.rol === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'agente.html';
                    }
                } else {
                    errorMsg.textContent = "Credenciales incorrectas.";
                    errorMsg.classList.remove('hidden');
                    btn.innerHTML = 'Acceder al Sistema';
                    btn.disabled = false;
                }
            } catch (err) {
                errorMsg.textContent = "Error de conexión con el servidor.";
                errorMsg.classList.remove('hidden');
                btn.innerHTML = 'Acceder al Sistema';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
